name: Build HOTSPOT LSPosed Module APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Langkah khusus untuk mengunduh Gradle Wrapper biner resmi secara otomatis
    - name: Setup Gradle Environment Automatically
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.8

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hotspot-lsposed-module-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 7
